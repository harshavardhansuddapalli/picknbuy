<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PicknBuy | LOGIN</title>

    <link rel="icon" href="../assets/images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <section class="login-section">
        <div class="container">
            <div class="row justify-content-center">

                <!-- Main Card -->
                <div class="col-12 col-lg-10 login-card">
                    <!-- CLOSE BUTTON -->
                    <a href="../index.html" class="close-btn">&times;</a>

                    <div class="row g-0">

                        <!-- LEFT PANEL -->
                        <div class="col-12 col-md-5 left-panel d-flex flex-column justify-content-center align-items-center">
                            <img src="../assets/images/logo.png" class="login-logo mb-3" alt="">
                            <h3 class="fw-bold">Pick N Buy</h3>
                            <p class="small mb-0">Pick It • Buy It • Love It</p>
                        </div>

                        <!-- RIGHT PANEL -->
                        <div class="col-12 col-md-7 right-panel px-5 py-4">

                            <h3 class="mb-4 fw-bold" style="color:#ff6a00;">LOGIN</h3>
                            <p class="small text-muted mb-4">
                                Please log in to access your profile and enjoy a personalized experience.
                            </p>

                            <form>

                                <label class="form-label">Enter Email / Username</label>
                                <input type="text" class="form-control mb-3" placeholder="abc@gmail.com" required>

                                <label class="form-label">Enter Password</label>
                                <input type="password" class="form-control mb-4" placeholder="******" required>

                                <button class="btn login-btn w-100 mb-3">Login</button>

                            </form>

                            <p class="signup-text">
                                New to Pick N Buy? <a href="../html/signup.html">Create an account</a>
                            </p>

                        </div>

                    </div>

                </div>

            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
