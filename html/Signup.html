<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick n Buy | Sign Up</title>

    <link rel="stylesheet" href="../css/Signup.css">
    <link rel="icon" href="../assets/images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<section class="Signup-section">
  <div class="container">
    <div class="row justify-content-center">
      
      <!-- CARD -->
      <div class="col-12 col-md-8 col-lg-5 signup-card">

        <!-- CLOSE BUTTON -->
        <a href="../index.html" class="close-btn">&times;</a>

        <!-- Logo Top -->
        <div class="top-panel text-center">
          <img src="../assets/images/logo.png" class="signup-logo mb-3" alt="">
        </div>

        <!-- Form Bottom -->
        <div class="bottom-panel px-4 pb-4">
            <h2 class="mb-4 fw-bold" style="color:#ff6a00;">Sign Up</h2>

            <form>

              <label class="form-label">Phone no / E-mail</label>
              <input type="text" class="input-line mb-3" placeholder="1234567890 / abc@gmail.com" required>

              <label class="form-label">Enter OTP</label>
              <input type="password" class="input-line mb-4" placeholder="******" required>

              <div class="mb-3">
                <input type="checkbox">
                <small>I accept the Terms and Conditions of Pick N Buy</small>
              </div>

              <button class="signup-btn w-100 mb-3">Sign Up</button>
            </form>

            <p class="login-text text-center">
              Already have an account? <a href="../html/login.html">Login</a>
            </p>
        </div>

      </div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
